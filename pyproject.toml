[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cli-anything-bcu"
version = "1.0.0"
description = "Agent-native CLI wrapping Bulk Crap Uninstaller (BCU-console) for Windows"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "bcu-cli contributors" }]
keywords = ["bcu", "uninstaller", "windows", "cli", "agent", "uninstall"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: System Administrators",
    "Topic :: System :: Systems Administration",
    "Topic :: System :: Software Distribution",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = ["click>=8.0.0", "prompt-toolkit>=3.0.0"]

[project.optional-dependencies]
dev = ["pytest>=7.0.0", "pytest-cov>=4.0.0"]

[project.urls]
Homepage = "https://github.com/Practice019/bcu-cli"
Source = "https://github.com/Practice019/bcu-cli"
Issues = "https://github.com/Practice019/bcu-cli/issues"

[project.scripts]
cli-anything-bcu = "cli_anything.bcu.bcu_cli:main"

[tool.setuptools]
package-dir = { "" = "src" }
# Explicit: `cli_anything` is a PEP 420 namespace package, so without this list
# discovery would also sweep any sibling cli_anything.* package.
packages = [
    "cli_anything.bcu",
    "cli_anything.bcu.core",
    "cli_anything.bcu.utils",
    "cli_anything.bcu.tests",
]

[tool.setuptools.package-data]
"cli_anything.bcu" = [
    "README.md",
    "skills/*.md",
    "tests/TEST.md",
    "tests/fixtures/*",
]

[tool.pytest.ini_options]
testpaths = ["src/cli_anything/bcu/tests"]
filterwarnings = ["ignore::DeprecationWarning"]
